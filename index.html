 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play-N-Joy</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Navigation Bar */
        .topnav {
            overflow: hidden;
            background-color: #4CAF50;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topnav .menu-icon {
            display: none; /* Hidden on large screens */
            cursor: pointer;
            padding: 14px 16px;
            color: white;
            font-size: 24px;
        }

        .topnav .menu-links {
            display: flex;
        }

        .topnav a {
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
            transition: background-color 0.3s, color 0.3s;
        }

        .topnav a:hover {
            background-color: #ddd;
            color: black;
        }

        .topnav a.active {
            background-color: #2e8b57;
            color: white;
        }

        /* Responsive Navigation Menu */
        @media screen and (max-width: 600px) {
            .topnav .menu-links {
                display: none;
                flex-direction: column;
                width: 100%;
                background-color: #4CAF50;
                position: absolute;
                top: 52px; /* Height of the topnav */
                left: 0;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            }
            .topnav .menu-links.show {
                display: flex;
            }
            .topnav .menu-icon {
                display: block;
            }
            .topnav a {
                padding: 12px 16px;
                text-align: left;
            }
        }

        /* Main Header Section */
        .main-header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-logo {
            height: 60px;
            margin-right: 15px;
        }

        .main-header h1 {
            margin: 0;
            font-size: 2.5em;
        }

        /* Main Content and Game Cards */
        main {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .game-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            overflow: hidden;
            width: 250px;
            text-align: center;
        }

        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .game-card a {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .game-card figure {
            margin: 0;
        }

        .game-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .game-card figcaption {
            padding: 15px;
            font-size: 1.2em;
            font-weight: bold;
            color: #4CAF50;
            background-color: #f9f9f9;
        }

        /* Footer styles */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px 0;
            margin-top: auto;
        }
    </style>
</head>
<body>

<div class="topnav">
    <div class="menu-icon" onclick="toggleMenu()">☰</div>
    <div class="menu-links">
        <a class="active" href="#home">Home</a>
        <a href="/news">News</a>
        <a href="Contact Us">Contact</a>
        <a href="/About">About</a>
    </div>
</div>

<header class="main-header">
    <div class="header-content">
        <img src="/images/logo.png" alt="logo" class="header-logo">
        <h1>Play~N~Joy</h1>
    </div>
</header>

<main>
    <div class="game-card">
        <a href="https://zv1y2i8p.play.gamezop.com/g/UCS62KJ8c">
            <figure>
                <img src="https://business.gamezop.com/img/gamezop/UCS62KJ8c/cover.jpg?w=600&q=50" alt="Block Blast">
                <figcaption>Block blast</figcaption>
            </figure>
        </a>
    </div>
    <div class="game-card">
        <a href="/games/merge-the-gems">
            <figure>
                <img src="/images/cover.png" alt="Merge the Gems">
                <figcaption>Merge The Gems</figcaption>
            </figure>
        </a>
    </div>
    <div class="game-card">
        <a href="https://zv1y2i8p.play.gamezop.com/g/rkAXTzkD5kX">
            <figure>
                <img src="https://business.gamezop.com/img/gamezop/rkAXTzkD5kX/cover.jpg?w=600&q=50" alt="Chess Master">
                <figcaption>Chess master</figcaption>
            </figure>
        </a>
    </div>
</main>

<footer>
    <p>&copy; All Rights Reserved</p>
</footer>

<script>
    function toggleMenu() {
        const menu = document.querySelector('.menu-links');
        menu.classList.toggle('show');
    }
</script>

</body>
</html
